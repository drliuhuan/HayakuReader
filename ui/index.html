<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HayakuReader</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/pdf.css">
  <link rel="stylesheet" href="/ui/reader.css">
  <script type="module" src="/ui/reader.js"></script>
</head>
<body>
  <aside id="sidebar">
    <header class="identity"><span class="brand-mark" aria-hidden="true">H</span><span>HayakuReader</span></header>
    <nav aria-label="阅读导航">
      <button type="button" data-tab="recent" aria-pressed="true">最近阅读</button>
      <button type="button" data-tab="contents" aria-pressed="false">目录</button>
      <button type="button" data-tab="notes" aria-pressed="false">批注</button>
    </nav>
    <div id="side-list" class="side-list"></div>
  </aside>
  <main>
    <header class="toolbar">
      <button id="toggle-sidebar" aria-label="切换侧栏" title="切换侧栏" aria-expanded="true">☰</button>
      <button id="open-file" class="primary">打开文件</button>
      <strong id="file-name"></strong>
      <div class="tools">
        <button id="search-toggle" disabled>搜索</button>
        <button id="bookmark" disabled>书签</button>
        <button id="page-note" disabled>笔记</button>
        <button id="settings-toggle" aria-expanded="false">阅读设置</button>
      </div>
    </header>
    <section id="settings" class="panel" hidden aria-label="阅读设置">
      <label>主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label>字号 <input id="font-size" type="range" min="14" max="32" value="19"></label>
      <label>行距 <input id="line-height" type="range" min="1.3" max="2.4" step="0.1" value="1.8"></label>
      <label>阅读宽度 <input id="text-width" type="range" min="480" max="1150" step="10" value="760"></label>
      <label id="encoding-label" hidden>TXT 编码 <select id="encoding"><option value="">自动</option><option value="utf-8">UTF-8</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option><option value="gb18030">GB18030</option></select></label>
    </section>
    <form id="search-form" class="panel" hidden role="search">
      <input id="query" type="search" placeholder="在正文中搜索" aria-label="搜索正文" required>
      <button type="submit">查找</button><button type="button" id="search-close">关闭</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="scroll" tabindex="0">
      <section id="welcome">
        <span class="brand-mark large" aria-hidden="true">H</span>
        <h1>打开一本书</h1>
        <p>选择本地文件，或者拖到这里。</p>
        <button id="welcome-open" class="primary">打开文件</button>
        <p class="formats">PDF · EPUB · TXT · Kindle · Word · HTML · Markdown</p>
      </section>
      <article id="reader" hidden></article>
    </div>
    <footer id="progress" hidden>
      <span id="location"></span>
      <div id="pdf-tools" hidden>
        <button id="previous" aria-label="上一页">‹</button>
        <input id="page-number" type="number" min="1" aria-label="跳到页码">
        <button id="next" aria-label="下一页">›</button>
        <button id="zoom-out" aria-label="缩小">−</button>
        <button id="fit">适合页宽</button>
        <button id="zoom-in" aria-label="放大">+</button>
      </div>
    </footer>
  </main>
  <div id="selection-tools" hidden>
    <button id="copy">复制</button><button id="highlight">高亮</button><button id="selection-note">笔记</button>
  </div>
  <dialog id="editor">
    <form method="dialog">
      <h2 id="editor-title"></h2>
      <blockquote id="excerpt"></blockquote>
      <label id="note-field">内容 <textarea id="note-text" rows="5"></textarea></label>
      <label id="color-field">颜色 <select id="color"><option value="yellow">黄色</option><option value="green">绿色</option><option value="blue">蓝色</option><option value="pink">粉色</option></select></label>
      <div class="dialog-actions">
        <button value="delete" id="delete-note" class="danger">删除</button>
        <button value="cancel">取消</button><button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>
</body>
</html>
