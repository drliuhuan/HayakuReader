[package]
name = "hayaku-reader"
version = "0.3.0-alpha.7"
edition = "2024"
license = "Apache-2.0"

[features]
default = []

[dependencies]
docboss-core = { git = "https://github.com/4thel00z/docboss.git", rev = "2bf47d5a96286e412424f4b2eb7d2eff41855418" }
docboss-font = { git = "https://github.com/4thel00z/docboss.git", rev = "2bf47d5a96286e412424f4b2eb7d2eff41855418" }
docboss-layout = { git = "https://github.com/4thel00z/docboss.git", rev = "2bf47d5a96286e412424f4b2eb7d2eff41855418" }
docboss-render = { git = "https://github.com/4thel00z/docboss.git", rev = "2bf47d5a96286e412424f4b2eb7d2eff41855418" }
ebook-rs = { version = "0.19.4", default-features = false }
eframe = "0.37"
egui = "0.37"
ego-tree = "0.10"
encoding_rs = "0.8"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
latex-rust = { version = "3.0", features = ["png"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
pulldown-cmark = "0.13"
resvg = "0.50"
rfd = "0.15"
roxmltree = "0.20"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
winreg = "0.55"

[build-dependencies]
cc = "1"
flate2 = "1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
